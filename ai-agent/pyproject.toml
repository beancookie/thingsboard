[project]
name = "thing-model-ai-agent"
version = "0.1.0"
description = "AI agent service for the China Railway IoT platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "openai>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "deepseek-harness-sdk==0.2.1rc2",
  "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires real ThingsBoard and thing-model services",
]

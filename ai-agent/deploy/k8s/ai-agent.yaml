apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secret
  namespace: <namespace>
type: Opaque
stringData:
  AI_AGENT_OPENAI_API_KEY: "<openai-api-key>"
  AI_AGENT_DEEPSEEK_API_KEY: "<deepseek-api-key>"
  AI_AGENT_INTERNAL_TOOL_TOKEN: "<internal-tool-token>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: <namespace>
data:
  AI_AGENT_ENABLED: "true"
  AI_AGENT_ENGINE: "openai"
  AI_AGENT_OPENAI_BASE_URL: "https://api.deepseek.com/v1"
  AI_AGENT_OPENAI_MODEL: "deepseek-chat"
  AI_AGENT_DSH_HOME: "/data/dsh-home"
  AI_AGENT_DSH_WORKSPACE: "/data/dsh-workspace"
  AI_AGENT_DSH_PROFILE: "sdk-minimal"
  AI_AGENT_DSH_PATCH_TEMPLATE: "dsh/thingsboard.patch.yml"
  AI_AGENT_DSH_PLUGIN_PATH: "dsh-plugin-thingsboard/index.js"
  AI_AGENT_DSH_PROVIDER: "deepseek-official"
  AI_AGENT_DSH_MODEL: "deepseek-v4-flash"
  AI_AGENT_DSH_TIMEOUT_SECONDS: "60"
  AI_AGENT_INTERNAL_AGENT_URL: "http://127.0.0.1:8000"
  AI_AGENT_TIMEOUT_SECONDS: "60"
  AI_AGENT_MAX_TOKENS: "2048"
  AI_AGENT_THING_MODEL_URL: "http://thing-model:8090"
  AI_AGENT_THINGSBOARD_URL: "http://thingsboard:8080"
  AI_AGENT_AUTH_CACHE_SECONDS: "60"
  AI_AGENT_MAX_MESSAGES: "20"
  AI_AGENT_MAX_TSL_BYTES: "2000000"
  AI_AGENT_MAX_ACTIONS: "10"
  AI_AGENT_MAX_TOOL_ROUNDS: "8"
  AI_AGENT_API_CATALOG_DIR: "config/api"
  AI_AGENT_API_MAX_RESPONSE_BYTES: "262144"
  AI_AGENT_FILE_TTL_SECONDS: "600"
  AI_AGENT_FILE_MAX_BYTES: "2000000"
  AI_AGENT_FILE_TEXT_MAX_BYTES: "65536"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: <namespace>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
        - name: ai-agent
          image: <registry>/ai-agent:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-agent-config
            - secretRef:
                name: ai-agent-secret
          volumeMounts:
            - name: dsh-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: dsh-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: <namespace>
spec:
  selector:
    app: ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000

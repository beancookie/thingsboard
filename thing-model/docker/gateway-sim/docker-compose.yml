services:
  tb-gateway:
    build:
      context: ./gateway
    image: tb-gateway-odbc:3.8.6
    container_name: tb-gateway-sim
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TB_GW_HOST: host.docker.internal
      TB_GW_PORT: 1883
      TB_GW_SECURITY_TYPE: accessToken
      TB_GW_ACCESS_TOKEN: ${TB_GW_ACCESS_TOKEN}
    volumes:
      - ./config:/thingsboard_gateway/config
      - tb-gw-logs:/thingsboard_gateway/logs
      - tb-gw-extensions:/thingsboard_gateway/extensions

  odbc-db:
    image: postgres:16-alpine
    container_name: tb-gateway-odbc
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway_sim
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5433:5432"
    volumes:
      - ./odbc/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - odbc-data:/var/lib/postgresql/data

volumes:
  tb-gw-logs:
  tb-gw-extensions:
  odbc-data:
